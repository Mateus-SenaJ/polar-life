/* Tokens · DOC-01 §2 (4 cores + #F8F9FA). Marca fixa em fundo branco: sem tema escuro (DS-01). */
:root{
  color-scheme:light;
  --white:#FFFFFF;--black:#000000;--blue:#006194;--orange:#FD761A;--surface-subtle:#F8F9FA;
  --outline-micro:rgb(0 0 0/.04);--outline-subtle:rgb(0 0 0/.08);
  --shadow-polaroid:0 16px 36px rgb(0 0 0/.08),0 2px 8px rgb(0 0 0/.04);
  --shadow-lifted:0 12px 32px -4px rgb(0 0 0/.08),0 4px 12px -2px rgb(0 0 0/.04);
  --ease:cubic-bezier(.2,.7,.2,1);
  --led-gradient-h:linear-gradient(90deg,#FD761A 0%,#FFFFFF 50%,#006194 100%);
  --led-ring-3:2.5px;
  --led-halo-2:-4px 3px 10px rgb(253 118 26/.14),4px -2px 10px rgb(0 97 148/.14);
  --font-serif:'Cormorant Garamond','Times New Roman',serif;--led-gradient-d:linear-gradient(135deg,#FD761A 0%,#FFFFFF 50%,#006194 100%);--halo-3:-6px 4px 14px rgb(253 118 26/.20),6px -3px 14px rgb(0 97 148/.20);--shadow-card:0 4px 20px rgb(0 0 0/.04),0 1px 4px rgb(0 0 0/.02);--shadow-floating:0 4px 16px rgb(0 0 0/.06);--shadow-subtle:0 2px 10px rgb(0 0 0/.03),0 1px 3px rgb(0 0 0/.02);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--surface-subtle)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surface-subtle);min-height:100vh;color:var(--black);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ===== LED · polar-led.css v4 com os 6 ajustes de produção (DOC-01 §11.7) ===== */
.led-btn{--core:var(--black);--ink:var(--white);position:relative;display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border:var(--led-ring-3) solid transparent;border-radius:12px;background-image:linear-gradient(var(--core),var(--core)),var(--led-gradient-h);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:-6px 4px 14px rgb(253 118 26/.20),6px -3px 14px rgb(0 97 148/.20);color:var(--ink);font:500 15px/1 'Inter',system-ui,sans-serif;letter-spacing:.01em;text-decoration:none;white-space:nowrap;cursor:pointer;overflow:hidden;transition:transform 150ms var(--ease),box-shadow 200ms var(--ease)}
.led-btn--light{--core:var(--white);--ink:var(--black);box-shadow:var(--led-halo-2),0 4px 14px rgb(0 0 0/.04)}
.led-btn--block{display:flex;width:100%}
.led-btn .btn-content{position:relative;z-index:2;display:flex;align-items:center;gap:12px;color:var(--ink);transition:color 200ms var(--ease)}
.led-btn .smoke-layer{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;background-color:var(--orange);background-image:linear-gradient(rgb(255 255 255/.30),rgb(255 255 255/.30)),radial-gradient(ellipse 60% 45% at 25% 35%,rgb(255 255 255/.75) 0%,rgb(255 255 255/0) 60%),radial-gradient(ellipse 50% 50% at 55% 50%,rgb(0 97 148/.65) 0%,rgb(0 97 148/0) 65%),radial-gradient(ellipse 45% 40% at 75% 60%,rgb(255 255 255/.70) 0%,rgb(255 255 255/0) 55%),radial-gradient(ellipse 55% 55% at 95% 75%,rgb(253 118 26/.95) 0%,rgb(253 118 26/0) 70%);background-size:100% 100%,200% 200%,200% 200%,200% 200%,200% 200%;background-blend-mode:normal,screen,screen,screen,screen;transition:opacity 350ms var(--ease)}
@media (hover:hover){
  .led-btn:hover .smoke-layer{opacity:1;animation:smoke-move 6s ease-in-out infinite alternate}
  .led-btn:hover .btn-content{--ink:var(--black)}
}
.led-btn:focus-visible .smoke-layer{opacity:1;animation:smoke-move 6s ease-in-out infinite alternate}
.led-btn:focus-visible .btn-content{color:var(--black)}
.led-btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.led-btn:active{transform:scale(.98)}
@keyframes smoke-move{
  0%{background-position:0 0,0% 30%,0% 30%,0% 30%,0% 30%}
  50%{background-position:0 0,70% 70%,70% 70%,70% 70%,70% 70%}
  100%{background-position:0 0,100% 40%,100% 40%,100% 40%,100% 40%}
}
@media (prefers-reduced-motion:reduce){
  .led-btn,.led-btn .btn-content,.led-btn .smoke-layer{transition:none}
  .led-btn:hover .smoke-layer,.led-btn:focus-visible .smoke-layer{animation:none;background-position:0 0,50% 50%,50% 50%,50% 50%,50% 50%}
}
@media (forced-colors:active){
  .led-btn{border:2px solid ButtonText;background-image:none;box-shadow:none}
  .led-btn .smoke-layer{display:none}
}


/* ===== T-04 · Processando ===== */
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:720px;margin:0 auto}
.ico{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sm{width:18px;height:18px}
strong{font-weight:500}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;line-height:1.4;text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.app-header{position:sticky;top:0;z-index:40;height:64px;background:rgb(255 255 255/.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 8px rgb(0 0 0/.04)}
.app-header .in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px}
.app-header a.logo{display:inline-flex;align-items:center;min-height:44px}
.logo-h{height:32px;width:auto}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;background:var(--white);border:1px solid var(--outline-subtle);border-radius:12px;box-shadow:var(--shadow-subtle);font:500 14px 'Inter',system-ui,sans-serif;color:var(--black);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn2--lg{height:48px}
.led-btn .btn-content{color:var(--ink)}
.led-btn[disabled]{background-image:none;background-color:var(--white);border:1px dashed rgb(0 0 0/.4);box-shadow:none;color:rgb(0 0 0/.6);cursor:not-allowed}
.led-btn[disabled] .smoke-layer{display:none}
.led-btn[disabled] .btn-content{color:rgb(0 0 0/.6)}
/* Botão carregando (DOC-01 §11.4): sem névoa e sem halo, miolo branco, barra de 3 px na base */
.led-btn[aria-busy=true]{--core:var(--white);--ink:var(--black);box-shadow:none;pointer-events:none}
.led-btn[aria-busy=true] .smoke-layer{display:none}
.led-btn__bar{display:none;position:absolute;left:16px;right:16px;bottom:6px;height:3px;border-radius:999px;overflow:hidden;background:var(--surface-subtle);z-index:2}
.led-btn__bar::after{content:"";display:block;width:40%;height:100%;border-radius:999px;background:var(--led-gradient-h);animation:slide 1.4s var(--ease) infinite alternate}
.led-btn[aria-busy=true] .led-btn__bar{display:block}

.page{padding-top:32px;padding-bottom:64px}
.head h1{margin:0;font-family:var(--font-serif);font-weight:400;font-size:26px;line-height:1.2}
.head p{margin:12px 0 0;max-width:56ch;font-size:16px;line-height:1.6}
.card{margin-top:24px;padding:20px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-card)}
.lblrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px;font-size:16px;line-height:1.4}
.lblrow .pct{font-size:14px;white-space:nowrap}

/* Barra determinada (DOC-01 §11.5) */
.prog{position:relative;height:8px}
.prog__glow{position:absolute;left:0;top:0;height:8px;width:var(--v,0%);border-radius:999px;background:var(--led-gradient-h);filter:blur(8px);opacity:.55;transition:width 300ms var(--ease)}
.prog__track{position:relative;display:block;height:8px;border-radius:999px;background:var(--white);border:1px solid var(--outline-subtle);overflow:hidden}
.prog__fill{display:block;height:100%;width:var(--v,0%);border-radius:999px;background:var(--led-gradient-h);transition:width 300ms var(--ease)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(150%)}}

.msg{display:flex;align-items:flex-start;gap:12px;margin-top:16px;padding:16px;background:var(--white);border:1px solid var(--outline-subtle);border-radius:12px;font-size:14px;line-height:1.5}
.msg .ico{margin-top:1px;color:var(--blue)}
.msg p{margin:0}
.msg--ok{border:1px solid var(--black)}
.msg--ok .ico{stroke-width:2}
.msg--err{border:2px solid var(--black)}
.msg--err>.ico{color:var(--black);stroke-width:2}
.msg--err:focus{outline:2px solid var(--blue);outline-offset:3px}
.msg__body{flex:1;min-width:0}

.fail{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:0}
.fail li{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px 0;border-top:1px solid var(--outline-subtle)}
.fail li:first-child{border-top:0;padding-top:4px}
.fail .nm{font-weight:500;word-break:break-all}
.fail .why{margin:2px 0 0}

details{margin-top:16px}
summary{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:500;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .ico{transition:transform 150ms var(--ease)}
details[open] summary .ico{transform:rotate(180deg)}
summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
.files{margin:8px 0 0;padding:0;list-style:none;max-height:320px;overflow:auto;border-radius:12px;background:var(--surface-subtle)}
.files li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 16px;font-size:14px}
.files .st{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;white-space:nowrap}
.files .st .ico{width:16px;height:16px;stroke-width:2}
.files .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;background:var(--white);border-radius:999px}

.act{display:flex;flex-direction:column-reverse;gap:12px;margin-top:24px}
.act .led-btn{width:100%}
.act .btn2{height:48px}
.okc{color:var(--blue)}

@media (min-width:768px){
  .head h1{font-size:32px}
  .page{padding-top:48px}
  .card{padding:32px}
  .act{flex-direction:row;justify-content:flex-end;align-items:center}
  .act .led-btn{width:auto;min-width:240px}
}
.toast{position:fixed;z-index:950;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;max-width:calc(100vw - 32px);padding:12px 16px;border:1px solid transparent;border-radius:8px;background-image:linear-gradient(#fff,#fff),var(--led-gradient-d);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:var(--shadow-floating);font-size:14px;font-weight:500}
@media (prefers-reduced-motion:reduce){.prog__glow,.prog__fill{transition:none}.led-btn__bar::after{animation:none;width:100%}summary .ico{transition:none}}
</style>

<main class="wrap page"><div class="narrow">
<div class="head">
<h1>Preparando suas fotos</h1>
<p>Cada foto é lida, convertida quando precisa e conferida aqui no seu aparelho.</p>
</div>

<section class="card" aria-labelledby="lbl">
<div class="lblrow"><span id="lbl"></span><span class="pct" id="pct"></span></div>
<div class="prog" id="prog" role="progressbar" aria-labelledby="lbl" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--v:0%">
<span class="prog__glow"></span><span class="prog__track"><span class="prog__fill"></span></span>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<div class="msg" id="lock"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><p>Processamento 100% local. Suas fotos não sobem para nenhum servidor.</p></div>

<div class="msg msg--ok" id="done" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><p id="done-t"></p></div>

<div class="msg msg--err" id="errbox" tabindex="-1" hidden>
<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
<div class="msg__body"><p><strong id="err-t"></strong></p><p id="err-d"></p><ul class="fail" id="fail"></ul></div>
</div>

<details id="det">
<summary><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span id="det-t">Ver todos os arquivos</span></summary>
<ul class="files" id="files"></ul>
</details>

<div class="act">
<a class="btn2" id="cancel" href="https://claude.ai/artifact/9FtzvdpTk247qVUV2VG6Gy">Cancelar</a>
<button type="button" class="led-btn led-btn--light" id="go" aria-busy="true" disabled><span class="smoke-layer" aria-hidden="true"></span><span class="btn-content" id="go-t">Preparando…</span><span class="led-btn__bar" aria-hidden="true"></span></button>
</div>
</section>
</div></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-t"></span></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var tm;function toast(m){clearTimeout(tm);$('toast-t').textContent=m;$('toast').hidden=false;tm=setTimeout(function(){$('toast').hidden=true},4000)}

/* Dados de exemplo (DOC-04 §6: 24 fotos). Nomes neutros. */
var N=24,HEIC={5:1,7:1,12:1,13:1,18:1,22:1};
var FILES=[];
for(var k=1;k<=N;k++){FILES.push({n:'foto-'+(k<10?'0':'')+k+(HEIC[k]?'.heic':'.jpg'),heic:!!HEIC[k],st:'wait'})}
/* Erros previstos (DOC-04 FL-02): memória e arquivo inválido */
var FAIL={7:{why:'O aparelho ficou sem memória para converter esta foto. Feche outras abas e tente de novo.',retry:'ok'},19:{why:'O arquivo está danificado ou não é uma foto aceita.',retry:'fail'}};

var hash=location.hash,cur=-1,timer=null,finished=false;
var ICON={
 ok:'<svg class="ico okc" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
 wait:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
 fail:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function pad(n){return n}
function counts(){var ok=0,fail=0,done=0;FILES.forEach(function(f){if(f.st==='ok'){ok++;done++}else if(f.st==='fail'){fail++;done++}});return{ok:ok,fail:fail,done:done}}
function plural(n,s,p){return n+' '+(n===1?s:p)}

function drawFiles(){
  $('files').innerHTML=FILES.map(function(f,i){
    var s;
    if(f.st==='ok')s=ICON.ok+'Pronta'+(f.heic?' <span class="tag mono">Convertida</span>':'');
    else if(f.st==='fail')s=ICON.fail+'Não suportada';
    else if(f.st==='work')s=ICON.wait+(f.heic?'Convertendo…':'Lendo…');
    else s=ICON.wait+'Aguardando';
    return '<li><span class="nm">'+f.n+'</span><span class="st">'+s+'</span></li>';
  }).join('');
}
function setProg(p){var el=$('prog');el.style.setProperty('--v',p+'%');el.setAttribute('aria-valuenow',p)}

function paint(){
  var c=counts();
  var pct=Math.round(c.done/N*100);setProg(pct);
  drawFiles();
  $('det-t').textContent='Ver todos os arquivos ('+N+')';
  if(!finished){
    var shown=Math.min(cur+1,N);
    $('lbl').textContent='Convertendo '+shown+' de '+N;
    $('pct').textContent=pct+'% concluído';
    $('prog').setAttribute('aria-valuetext','Convertendo '+shown+' de '+N);
  }else{
    $('lbl').textContent='Concluído · '+c.ok+' de '+N+' fotos preparadas';
    $('pct').textContent='';
    $('prog').setAttribute('aria-valuetext','Concluído');
  }
  /* erros por arquivo (MT-05): lista «não suportadas» com «Tentar de novo» */
  var failed=FILES.map(function(f,i){return{f:f,i:i}}).filter(function(x){return x.f.st==='fail'});
  var eb=$('errbox');
  if(failed.length){
    eb.hidden=false;
    $('err-t').textContent=plural(failed.length,'arquivo não pôde ser preparado','arquivos não puderam ser preparados');
    $('err-d').textContent=finished?'As outras '+plural(c.ok,'foto está pronta','fotos estão prontas')+'. Você pode tentar de novo ou continuar sem elas.':'';
    $('fail').innerHTML=failed.map(function(x){
      var why=x.f.why;
      return '<li><div><span class="nm">'+x.f.n+'</span><p class="why">'+why+'</p></div><button type="button" class="btn2" data-i="'+x.i+'">Tentar de novo</button></li>';
    }).join('');
  }else{eb.hidden=true}
  /* sucesso (§5) */
  var dn=$('done');
  if(finished&&c.ok>0&&!failed.length){dn.hidden=false;$('done-t').innerHTML='<strong>Concluído</strong> · '+plural(c.ok,'foto pronta','fotos prontas')}
  else dn.hidden=true;
  /* botão principal */
  var go=$('go');
  if(finished&&c.ok>0){go.removeAttribute('aria-busy');go.disabled=false;$('go-t').innerHTML='Continuar com '+plural(c.ok,'foto','fotos')+'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'}
  else if(finished){go.removeAttribute('aria-busy');go.disabled=true;$('go-t').textContent='Continuar'}
  else{go.setAttribute('aria-busy','true');go.disabled=true;$('go-t').textContent='Preparando…'}
}

function say(t){$('live').textContent=t}
function finish(){
  finished=true;clearInterval(timer);
  paint();
  var c=counts();
  say(c.fail?('Concluído. '+plural(c.ok,'foto pronta','fotos prontas')+' e '+plural(c.fail,'arquivo com erro','arquivos com erro')+'.'):('Concluído. '+plural(c.ok,'foto pronta','fotos prontas')+'.'));
}
function step(){
  if(cur>=0){
    var f=FILES[cur],num=cur+1;
    if(FAIL[num]&&hash!=='#concluido'){f.st='fail';f.why=FAIL[num].why}else f.st='ok';
  }
  cur++;
  if(cur>=N){finish();return}
  FILES[cur].st='work';
  paint();
  var pc=Math.round(counts().done/N*100);
  if(pc>=25&&pc<30)say('25% concluído');if(pc>=50&&pc<55)say('50% concluído');if(pc>=75&&pc<80)say('75% concluído');
}
function jump(n){ /* estados de revisão */
  for(var i=0;i<n;i++){FILES[i].st=(FAIL[i+1]&&hash!=='#concluido')?'fail':'ok';if(FILES[i].st==='fail')FILES[i].why=FAIL[i+1].why}
  cur=n;FILES[n].st='work';
}
if(hash==='#processando'){jump(2);paint()}   /* parado em «Convertendo 3 de 24» */
else if(hash==='#concluido'||hash==='#erro'){
  for(var i=0;i<N;i++){var ff=FILES[i];if(FAIL[i+1]&&hash==='#erro'){ff.st='fail';ff.why=FAIL[i+1].why}else ff.st='ok'}
  cur=N;finish();
}else{paint();timer=setInterval(step,320);step()}

/* Tentar de novo, por arquivo */
$('fail').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var i=Number(b.dataset.i),f=FILES[i],num=i+1;
  b.disabled=true;b.textContent='Tentando…';
  setTimeout(function(){
    if(FAIL[num]&&FAIL[num].retry==='ok'){f.st='ok';delete f.why;say(f.n+' preparada.');paint();var nb=$('fail').querySelector('button');(nb||$('go')).focus()}
    else{b.disabled=false;b.textContent='Tentar de novo';toast('Ainda não foi possível ler este arquivo.')}
  },900);
});
$('go').addEventListener('click',function(){if(this.disabled)return;toast('Próxima etapa: resumo da importação.')});
$('cancel').addEventListener('click',function(){clearInterval(timer)});
window.addEventListener('hashchange',function(){location.reload()});
})();
</script>
