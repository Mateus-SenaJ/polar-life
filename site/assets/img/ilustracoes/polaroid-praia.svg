        <path d="M4 48q5-2.6 10 0t10 0t10 0t10 0t10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity=".75"/>
        <path d="M0 62Q18 59 38 62T76 61V76H0Z" fill="#FD761A" fill-opacity=".18"/>
        <path d="M47 39V30" fill="none" stroke="#000000" stroke-width="1"/>
        <path d="M48 31L54 38H48Z" fill="#FFFFFF" opacity=".95"/>
        <path d="M45 39H55L53 42H47Z" fill="#000000"/>
