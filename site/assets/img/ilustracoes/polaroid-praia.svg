          <path d="M21 43C17 44 14 47 13 51C16 47 19 45 22 44Z" fill="#000000"/>
          <circle cx="19.5" cy="45" r="1.3" fill="#000000"/>
          <circle cx="22.5" cy="46" r="1.2" fill="#000000"/>
        </g>
        <path d="M36 15q2-2 4 0M41 12q2-2 4 0" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
  </g>
