    <path d="M0 88H300" stroke="#000000" stroke-opacity=".1" stroke-width="2"/>
    <!-- anima: cam-flash pisca, centro 64 44 -->
    <g id="cam-flash">
      <rect x="24" y="20" width="80" height="48" rx="10" fill="#F8F9FA"/>
      <rect x="30" y="26" width="68" height="36" rx="6" fill="#FFFFFF"/>
