  <!-- anima: cam-fenda é a boca de saída, não se move -->
  <g id="cam-fenda">
    <rect x="66" y="212" width="168" height="16" rx="8" fill="#000000"/>
    <path d="M76 216H224" fill="none" stroke="#F8F9FA" stroke-width="1.5" opacity=".35"/>
  </g>
  <g clip-path="url(#cam-clip-fenda)">
    <!-- anima: cam-foto sai pela fenda, translateY 150 → 240 (clip estático no grupo pai) -->
