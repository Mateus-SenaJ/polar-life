    <g fill="#000000" opacity=".85"><rect x="214" y="168" width="64" height="6" rx="3"/><rect x="214" y="180" width="64" height="6" rx="3"/><rect x="214" y="192" width="64" height="6" rx="3"/></g>
    <circle cx="34" cy="196" r="5" fill="#FD761A"/>
    <rect x="18" y="106" width="22" height="10" rx="5" fill="#000000" fill-opacity=".85"/>
