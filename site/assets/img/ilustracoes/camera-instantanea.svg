      <g transform="translate(10.23 10.23) scale(1.7045)" opacity=".3"><use href="#cam-cena-montanha"/></g>
      <rect x="10.23" y="10.23" width="129.54" height="129.54" fill="none" stroke="#000000" stroke-opacity=".06"/>
    </g>
  </g>
  </g>
