      <feDropShadow in="cam-s2" dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <clipPath id="cam-clip-fenda"><rect x="-40" y="220" width="380" height="600"/></clipPath>
