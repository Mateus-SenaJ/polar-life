        <path d="M42 54H58L55 58H45Z" fill="#000000"/>
        <path d="M8 16q3-3 6 0M18 12q3-3 6 0" fill="none" stroke="#000000" stroke-width=".8" stroke-linecap="round"/>
      </g>
    </g>

