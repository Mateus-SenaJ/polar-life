          <rect x="6" y="60" width="3" height="3.5"/><rect x="13" y="60" width="3" height="3.5"/>
          <rect x="6" y="68" width="3" height="3.5"/><rect x="13" y="68" width="3" height="3.5"/>
          <rect x="31" y="53" width="3" height="3.5"/><rect x="38" y="53" width="3" height="3.5"/>
          <rect x="31" y="61" width="3" height="3.5"/><rect x="38" y="61" width="3" height="3.5"/>
          <rect x="74" y="55" width="3" height="3.5"/><rect x="81" y="55" width="3" height="3.5"/>
          <rect x="74" y="63" width="3" height="3.5"/><rect x="81" y="63" width="3" height="3.5"/>
        </g>
        <g fill="#FD761A" opacity=".9">
          <rect x="6" y="74" width="3" height="3"/>
          <rect x="38" y="70" width="3" height="3"/>
          <rect x="81" y="72" width="3" height="3"/>
          <rect x="104" y="63" width="3" height="3"/>
        </g>
        <rect y="86" width="126" height="10" fill="#000000"/>
      </g>
