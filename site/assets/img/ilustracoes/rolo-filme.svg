    <g id="rolo-q2" clip-path="url(#rolo-clip2)">
      <g transform="translate(172 42)">
        <rect width="126" height="96" fill="#FFFFFF"/>
        <rect width="126" height="96" fill="#006194" fill-opacity=".14"/>
        <circle cx="104" cy="20" r="9" fill="#FD761A"/>
        <path d="M0 82L26 40L44 60L66 28L92 64L108 44L126 78V96H0Z" fill="#006194" fill-opacity=".55"/>
        <path d="M66 28L73 40L68 38L63 43L60 37Z" fill="#FFFFFF" opacity=".9"/>
