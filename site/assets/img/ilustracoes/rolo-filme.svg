<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180">
  <defs>
    <filter id="rolo-sombra" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity=".12"/>
    </filter>
    <pattern id="rolo-furos" width="26" height="10" patternUnits="userSpaceOnUse">
      <rect x="5" y="1" width="9" height="8" rx="2" fill="#F8F9FA"/>
    </pattern>
    <clipPath id="rolo-clip1"><rect x="34" y="42" width="126" height="96"/></clipPath>
    <clipPath id="rolo-clip2"><rect x="172" y="42" width="126" height="96"/></clipPath>
    <clipPath id="rolo-clip3"><rect x="310" y="42" width="126" height="96"/></clipPath>
    <clipPath id="rolo-clip4"><rect x="448" y="42" width="126" height="96"/></clipPath>
  </defs>

  <!-- anima: rolo-tira anda para a esquerda, translateX 0 → -172 (um quadro) -->
  <g id="rolo-tira" filter="url(#rolo-sombra)">
    <rect x="10" y="20" width="580" height="140" rx="10" fill="#000000"/>
    <rect x="22" y="25" width="556" height="10" fill="url(#rolo-furos)"/>
    <rect x="22" y="145" width="556" height="10" fill="url(#rolo-furos)"/>

    <!-- anima: rolo-q1 é um quadro fixo da tira, centro 97 90 -->
    <g id="rolo-q1" clip-path="url(#rolo-clip1)">
      <g transform="translate(34 42)">
        <rect width="126" height="96" fill="#FFFFFF"/>
        <rect width="126" height="96" fill="#006194" fill-opacity=".14"/>
        <circle cx="98" cy="24" r="10" fill="#FD761A"/>
        <rect y="54" width="126" height="24" fill="#006194" fill-opacity=".55"/>
        <path d="M0 78Q28 74 56 78T126 77V96H0Z" fill="#FD761A" fill-opacity=".18"/>
