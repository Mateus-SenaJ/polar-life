<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 112">
  <defs>
    <filter id="casal-sombra" x="-20%" y="-15%" width="140%" height="132%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <clipPath id="casal-janela"><rect x="8" y="8" width="76" height="76"/></clipPath>
  </defs>
  <!-- anima: casal-moldura pode balançar como polaroid apoiada (centro 48 56) -->
  <g id="casal-moldura" filter="url(#casal-sombra)">
    <rect x="2" y="2" width="88" height="107" rx="2" fill="#FFFFFF"/>
    <g clip-path="url(#casal-janela)">
      <g id="casal-cena" transform="translate(8 8)">
        <rect width="76" height="76" fill="#006194" fill-opacity=".14"/>
        <!-- mesa -->
        <rect y="60" width="76" height="16" fill="#FD761A" fill-opacity=".18"/>
        <path d="M0 60H76" fill="none" stroke="#000000" stroke-width=".8" opacity=".45"/>
        <!-- anima: casal-vapor sobe devagar e some, centro 38 40 -->
        <g id="casal-vapor" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" opacity=".35">
          <path d="M21 44c-2-3 1-5-1-8"/>
          <path d="M26 44c2-3-1-5 1-8"/>
          <path d="M50 44c-2-3 1-5-1-8"/>
          <path d="M55 44c2-3-1-5 1-8"/>
        </g>
        <!-- anima: casal-coracao pulsa devagar, centro 38 27 -->
        <g id="casal-coracao">
          <path d="M38 38C34 34 26 29 26 22a6 6 0 0 1 12 0a6 6 0 0 1 12 0c0 7-8 12-12 16z" fill="#FD761A" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
        </g>
        <!-- xícara da esquerda (faixa laranja) -->
        <ellipse cx="23.5" cy="60" rx="12" ry="2.4" fill="#FFFFFF" stroke="#000000" stroke-width=".8"/>
        <path d="M15 49h-2.5a3.5 3.5 0 0 0 0 7H15" fill="none" stroke="#000000" stroke-width="1.2"/>
        <path d="M14 46h19v8a5 5 0 0 1-5 5h-9a5 5 0 0 1-5-5z" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
        <rect x="14.5" y="48.5" width="18" height="2.6" fill="#FD761A"/>
        <!-- xícara da direita (faixa azul) -->
        <ellipse cx="52.5" cy="60" rx="12" ry="2.4" fill="#FFFFFF" stroke="#000000" stroke-width=".8"/>
        <path d="M61 49h2.5a3.5 3.5 0 0 1 0 7H61" fill="none" stroke="#000000" stroke-width="1.2"/>
        <path d="M43 46h19v8a5 5 0 0 1-5 5h-9a5 5 0 0 1-5-5z" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
        <rect x="43.5" y="48.5" width="18" height="2.6" fill="#006194"/>
        <!-- brilhos -->
        <path d="M10 14v4M8 16h4M66 22v3M64.5 23.5h3" fill="none" stroke="#FD761A" stroke-width="1" stroke-linecap="round" opacity=".8"/>
      </g>
    </g>
  </g>
</svg>
