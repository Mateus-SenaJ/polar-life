<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 112">
  <defs>
    <filter id="cal-sombra" x="-20%" y="-15%" width="140%" height="132%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <clipPath id="cal-janela"><rect x="8" y="8" width="76" height="76"/></clipPath>
  </defs>
  <!-- anima: cal-moldura pode balançar como polaroid apoiada (centro 48 56) -->
  <g id="cal-moldura" filter="url(#cal-sombra)">
    <rect x="2" y="2" width="88" height="107" rx="2" fill="#FFFFFF"/>
    <g clip-path="url(#cal-janela)">
      <g id="cal-cena" transform="translate(8 8)">
        <rect width="76" height="76" fill="#006194" fill-opacity=".14"/>
        <!-- folha do calendário -->
        <rect x="10" y="13" width="60" height="60" rx="1.5" fill="#000000" opacity=".08"/>
        <rect x="8" y="11" width="60" height="60" rx="1.5" fill="#FFFFFF" stroke="#000000" stroke-width=".8"/>
        <path d="M8 20h60v-7.5a1.5 1.5 0 0 0-1.5-1.5h-57a1.5 1.5 0 0 0-1.5 1.5z" fill="#006194"/>
        <rect x="28" y="14.3" width="20" height="2.2" rx="1.1" fill="#FFFFFF" opacity=".9"/>
        <rect x="17" y="7" width="2.4" height="8" rx="1.2" fill="#000000"/>
        <rect x="56.6" y="7" width="2.4" height="8" rx="1.2" fill="#000000"/>
        <!-- dias -->
        <g fill="#000000" opacity=".4">
          <rect x="18" y="25" width="4" height="1.6" rx=".8"/><rect x="26" y="25" width="4" height="1.6" rx=".8"/><rect x="34" y="25" width="4" height="1.6" rx=".8"/><rect x="42" y="25" width="4" height="1.6" rx=".8"/><rect x="50" y="25" width="4" height="1.6" rx=".8"/><rect x="58" y="25" width="4" height="1.6" rx=".8"/>
          <rect x="10" y="34" width="4" height="1.6" rx=".8"/><rect x="18" y="34" width="4" height="1.6" rx=".8"/><rect x="26" y="34" width="4" height="1.6" rx=".8"/><rect x="34" y="34" width="4" height="1.6" rx=".8"/><rect x="42" y="34" width="4" height="1.6" rx=".8"/><rect x="50" y="34" width="4" height="1.6" rx=".8"/><rect x="58" y="34" width="4" height="1.6" rx=".8"/>
          <rect x="10" y="43" width="4" height="1.6" rx=".8"/><rect x="18" y="43" width="4" height="1.6" rx=".8"/><rect x="26" y="43" width="4" height="1.6" rx=".8"/><rect x="42" y="43" width="4" height="1.6" rx=".8"/><rect x="50" y="43" width="4" height="1.6" rx=".8"/><rect x="58" y="43" width="4" height="1.6" rx=".8"/>
          <rect x="10" y="52" width="4" height="1.6" rx=".8"/><rect x="18" y="52" width="4" height="1.6" rx=".8"/><rect x="26" y="52" width="4" height="1.6" rx=".8"/><rect x="34" y="52" width="4" height="1.6" rx=".8"/><rect x="42" y="52" width="4" height="1.6" rx=".8"/>
          <rect x="10" y="61" width="4" height="1.6" rx=".8"/><rect x="18" y="61" width="4" height="1.6" rx=".8"/><rect x="26" y="61" width="4" height="1.6" rx=".8"/><rect x="34" y="61" width="4" height="1.6" rx=".8"/>
        </g>
        <!-- anima: cal-circulo desenha-se em volta do dia, centro 36 44 -->
        <g id="cal-circulo">
          <rect x="34" y="43" width="4" height="1.8" rx=".9" fill="#FD761A"/>
          <circle cx="36" cy="43.9" r="4.6" fill="none" stroke="#FD761A" stroke-width="1.6"/>
        </g>
        <!-- anima: cal-polaroid balança no alfinete, centro 59 46 -->
        <g id="cal-polaroid" transform="rotate(-8 59 46)">
          <rect x="49.5" y="45.5" width="22" height="26" rx="1" fill="#000000" opacity=".12"/>
          <rect x="48" y="44" width="22" height="26" rx="1" fill="#FFFFFF" stroke="#000000" stroke-width=".7"/>
          <rect x="50" y="46" width="18" height="16" fill="#006194" fill-opacity=".55"/>
          <circle cx="63" cy="51" r="3" fill="#FD761A"/>
          <path d="M50 58q4-2 8 0t8 0" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".8"/>
          <circle cx="59" cy="45" r="2.2" fill="#FD761A" stroke="#FFFFFF" stroke-width=".7"/>
        </g>
      </g>
    </g>
  </g>
</svg>
