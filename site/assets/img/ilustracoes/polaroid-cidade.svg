<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 112">
  <defs>
    <filter id="cidade-sombra" x="-20%" y="-15%" width="140%" height="132%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <clipPath id="cidade-janela"><rect x="8" y="8" width="76" height="76"/></clipPath>
    <pattern id="cidade-vidros" width="6" height="7" patternUnits="userSpaceOnUse">
      <rect x="1.4" y="1.4" width="2.2" height="3" fill="#FFFFFF" opacity=".85"/>
    </pattern>
  </defs>
  <!-- anima: cidade-moldura pode balançar como polaroid apoiada (centro 48 56) -->
  <g id="cidade-moldura" filter="url(#cidade-sombra)">
    <rect x="2" y="2" width="88" height="107" rx="2" fill="#FFFFFF"/>
    <g clip-path="url(#cidade-janela)">
      <g id="cidade-cena" transform="translate(8 8)">
        <rect width="76" height="76" fill="#006194" fill-opacity=".14"/>
        <!-- anima: cidade-sol pulsa devagar, centro 14 15 -->
        <g id="cidade-sol"><circle cx="14" cy="15" r="6.5" fill="#FD761A"/></g>
        <path d="M0 60V38H9V30H16V42H22V26H30V40H36V33H43V24H52V38H58V31H65V42H70V35H76V60Z" fill="#006194" fill-opacity=".55"/>
        <rect x="1" y="44" width="13" height="24" fill="#000000"/>
        <rect x="17" y="38" width="12" height="30" fill="#000000"/>
        <rect x="32" y="49" width="11" height="19" fill="#000000"/>
        <rect x="46" y="41" width="14" height="27" fill="#000000"/>
        <rect x="63" y="47" width="12" height="21" fill="#000000"/>
        <rect x="1" y="44" width="13" height="24" fill="url(#cidade-vidros)"/>
        <rect x="17" y="38" width="12" height="30" fill="url(#cidade-vidros)"/>
        <rect x="32" y="49" width="11" height="19" fill="url(#cidade-vidros)"/>
        <rect x="46" y="41" width="14" height="27" fill="url(#cidade-vidros)"/>
        <rect x="63" y="47" width="12" height="21" fill="url(#cidade-vidros)"/>
        <g fill="#FD761A" opacity=".9">
          <rect x="4" y="58" width="2.6" height="3"/>
          <rect x="20" y="62" width="2.6" height="3"/>
          <rect x="49" y="57" width="2.6" height="3"/>
          <rect x="66" y="60" width="2.6" height="3"/>
        </g>
        <path d="M52 24V17" fill="none" stroke="#000000" stroke-width="1"/>
        <circle cx="52" cy="16" r="1.4" fill="#FD761A"/>
        <rect y="66" width="76" height="10" fill="#000000"/>
        <path d="M32 21q2-2 4 0M38 18q2-2 4 0" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
