<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 112">
  <defs>
    <filter id="viagem-sombra" x="-20%" y="-15%" width="140%" height="132%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <clipPath id="viagem-janela"><rect x="8" y="8" width="76" height="76"/></clipPath>
  </defs>
  <!-- anima: viagem-moldura pode balançar como polaroid apoiada (centro 48 56) -->
  <g id="viagem-moldura" filter="url(#viagem-sombra)">
    <rect x="2" y="2" width="88" height="107" rx="2" fill="#FFFFFF"/>
    <g clip-path="url(#viagem-janela)">
      <g id="viagem-cena" transform="translate(8 8)">
        <rect width="76" height="76" fill="#006194" fill-opacity=".14"/>
        <circle cx="10" cy="12" r="6" fill="#FD761A"/>
        <path d="M4 62C16 54 30 58 40 48C50 38 56 28 68 20" fill="none" stroke="#006194" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/>
        <!-- anima: viagem-nuvens deslizam para a direita, centro 18 28 -->
        <g id="viagem-nuvens" fill="#FFFFFF" opacity=".92">
          <g>
            <circle cx="12" cy="28" r="5"/><circle cx="18" cy="26" r="6"/><circle cx="24" cy="29" r="4.5"/>
            <rect x="12" y="28" width="12" height="4" rx="2"/>
          </g>
          <g opacity=".8">
            <circle cx="54" cy="16" r="3.4"/><circle cx="58" cy="14.5" r="4.2"/><circle cx="62" cy="16.6" r="3"/>
            <rect x="54" y="16" width="8" height="2.8" rx="1.4"/>
          </g>
        </g>
        <path d="M0 76V64C12 62 18 66 28 64C40 62 48 66 58 64C66 63 72 65 76 64V76Z" fill="#006194" fill-opacity=".14"/>
        <!-- anima: viagem-pin salta, centro 64 52 -->
        <g id="viagem-pin">
          <path d="M64 58C60 53 60 49 64 47C68 49 68 53 64 58Z" fill="#FD761A"/>
          <circle cx="64" cy="51" r="1.5" fill="#FFFFFF"/>
        </g>
        <!-- anima: viagem-aviao voa em diagonal, centro 46 38 -->
        <g id="viagem-aviao">
          <path d="M18 44C28 36 52 32 64 36C70 38 70 42 64 44C54 48 32 48 22 47Z" fill="#000000"/>
          <path d="M38 38L46 24L53 25L48 39Z" fill="#000000"/>
          <path d="M36 45L38 56L45 55L45 46Z" fill="#000000"/>
          <path d="M62 37L71 29L73 31L67 41Z" fill="#FD761A"/>
          <path d="M28 42C36 39 44 37 52 37" fill="none" stroke="#FD761A" stroke-width="1.6"/>
          <g fill="#FFFFFF">
            <circle cx="52" cy="39" r="1.1"/>
            <circle cx="56" cy="38.6" r="1.1"/>
            <circle cx="60" cy="38.2" r="1.1"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
