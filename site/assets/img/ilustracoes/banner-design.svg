  </g>

  <!-- anima: bdes-moldura tracejada aparece e some, centro 560 249 -->
  <g id="bdes-moldura">
    <rect x="430" y="95" width="260" height="308" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 7"/>
    <g fill="#FFFFFF">
      <rect x="424" y="89" width="12" height="12"/>
      <rect x="678" y="89" width="12" height="12"/>
      <rect x="424" y="397" width="12" height="12"/>
      <rect x="678" y="397" width="12" height="12"/>
