<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/icones/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/icones/favicon-16.png">
<link rel="apple-touch-icon" href="../../assets/img/icones/apple-touch-icon-180.png">
<link rel="manifest" href="../../app/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="Polar Life">
<link rel="stylesheet" href="../../assets/css/ui/pwa.css">
<title>Polar Life · Adicionar fotos</title>
<meta name="description" content="Escolha as fotos do seu projeto. Elas continuam no seu aparelho.">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<!-- PENDENTE (T6, TP-06): Cormorant Garamond ainda vem do Google Fonts neste protótipo. Hospedar antes de produção. Inter já está embutida. -->
<link rel="stylesheet" href="../../assets/css/base/fonts.css">
<link rel="stylesheet" href="../../assets/css/base/tokens.css">
<link rel="stylesheet" href="../../assets/css/base/led.css">
<link rel="stylesheet" href="../../assets/css/ui/movimento.css">
<link rel="stylesheet" href="../../assets/css/pages/adicionar-fotos.css">
<!-- D-123: guarda de sessão (modo demonstração) -->
<script src="../../assets/js/nucleo/conta.js"></script>
<script src="../../assets/js/ui/guarda.js"></script>
</head>
<body>

<header class="app-header"><div class="in">
<a class="logo" href="../" aria-label="Polar Life, seus projetos"><img class="logo-h" src="../../assets/img/logos/Logo_tipografia_lateral.png" width="93" height="32" alt="Polar Life"></a>
<a class="btn2" href="../novo-projeto/"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar</a>
</div></header>

<main class="wrap page">
<div class="head">
<h1>Adicionar fotos</h1>
<p>Suas fotos continuam no seu aparelho. Você escolhe o que trazer.</p>
</div>

<section class="pick" aria-labelledby="h-aparelho">
<div class="drop" id="drop">
<svg class="ico drop__ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
<h2 class="sec" id="h-aparelho">Escolha suas fotos</h2>
<p class="only-pointer">Arraste as fotos até aqui, cole ou escolha pelos botões.</p>
<p class="small" id="fmts">JPEG, PNG, WebP, RAW e pastas .zip. HEIC abre no iPhone e no Safari.</p>
<div class="drop__act">
<button type="button" class="led-btn led-btn--light" id="btn-device"><span class="smoke-layer" aria-hidden="true"></span><span class="btn-content" id="btn-device-t">Escolher do aparelho<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
<button type="button" class="btn2" id="btn-camera"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Usar a câmera</button>
<button type="button" class="btn2" id="btn-gfotos"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 010-8 5 5 0 019.5 1A3.5 3.5 0 0116.5 18z"/></svg>Do Google Fotos</button>
</div>
<input type="file" id="f-device" multiple accept="image/*,.avif,.heic,.heif,.tif,.tiff,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.zip" hidden>
<input type="file" id="f-camera" accept="image/*" capture="environment" hidden>
</div>
<div class="got" id="got" aria-live="polite" hidden></div>
<p class="pick__con"><a class="link" href="../conexoes/">O Google Fotos não abre? Verificar conexões</a></p>   <!-- D-181: ajuda secundária, abaixo das origens -->
</section>

</main>

<div class="toast led-box led-box--1" id="toast" role="status" aria-live="polite" hidden><span id="toast-t"></span></div>

<script src="../../assets/js/nucleo/exif.js" defer></script>
<script src="../../assets/js/nucleo/fotos-locais.js" defer></script>
<script src="../../assets/js/nucleo/importar.js" defer></script>
<script src="../../assets/js/nucleo/projetos.js" defer></script>
<script src="../../assets/js/nucleo/sessao.js" defer></script>
<script src="../../assets/js/nucleo/google.js" defer></script>
<script src="../../assets/js/nucleo/google-fotos.js" defer></script>
<script src="../../assets/js/pages/adicionar-fotos.js" defer></script>
<script src="../../assets/js/ui/pwa.js" defer></script>
</body>
</html>
