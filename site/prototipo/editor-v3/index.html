<div class="app" id="app">

    <button type="button" class="ib" id="undo" aria-label="Desfazer (Ctrl+Z)" disabled><svg class="ico"><use href="#i-undo"/></svg></button>

    <button type="button" class="btn2"><svg class="ico sm"><use href="#i-download"/></svg>Salvar .polarlife</button>
    <button type="button" class="led-btn led-btn--sm"><span class="smoke-layer" aria-hidden="true"></span><span class="btn-content"><svg class="ico sm"><use href="#i-print"/></svg><span>Revisar impressão</span></span></button>
    <span class="avatar" aria-hidden="true"><svg class="ico sm"><use href="#i-person"/></svg></span>
    <span class="ctx__wrap"><button type="button" class="ib" id="mais-b" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false"><svg class="ico"><use href="#i-more"/></svg></button><div class="pop pop--dir" id="mais-pop" hidden role="group" aria-label="Mais opções"><button type="button" class="pop__i so-m"><svg class="ico sm"><use href="#i-download"/></svg>Salvar .polarlife</button><button type="button" class="pop__i so-m"><svg class="ico sm"><use href="#i-person"/></svg>Conta</button><button type="button" class="pop__i"><svg class="ico sm"><use href="#i-text"/></svg>Renomear projeto</button><button type="button" class="pop__i"><svg class="ico sm"><use href="#i-info"/></svg>Atalhos de teclado</button></div></span>
  </div>
</header>

<section class="mesa" aria-label="Mesa">
  <div class="ctx">
    <span class="pill ctx--m"><span class="rotulo">Passo 2 de 3</span></span>
    <span class="pill"><svg class="ico sm" style="color:var(--blue)"><use href="#i-photos"/></svg><span class="rotulo">Foto</span><span class="mono" id="ctx-n">03 de 24</span></span>
    <span class="pill"><svg class="ico sm" style="color:var(--blue)"><use href="#i-frame"/></svg><span class="rotulo">Clássico</span><span class="mono">88 × 107 mm</span></span>
    <span class="pill" id="ctx-q" role="status"><span class="q" aria-hidden="true"></span><span>Excelente</span></span>
    <span class="ctx__wrap">
      <button type="button" class="pill pill--btn pill--escopo" id="escopo-b" aria-haspopup="true" aria-expanded="false"><span class="dot dot--o" id="escopo-dot" aria-hidden="true" hidden></span><span class="rotulo">Alterando</span><span id="escopo-t">só esta foto</span><svg class="ico sm"><use href="#i-down"/></svg></button>
      <div class="pop" id="escopo-pop" hidden role="group" aria-label="Escopo da alteração">
        <label><input type="radio" name="escopo" value="esta" checked>Só esta foto · 03</label>
        <label><input type="radio" name="escopo" value="sel">Selecionadas · 2</label>
        <label><input type="radio" name="escopo" value="folha">Esta folha · 4 fotos</label>
        <label><input type="radio" name="escopo" value="todas">Todas · 24</label>
              </div>
    </span>
    <span class="ctx__sp"></span>
    <span class="pill"><svg class="ico sm"><use href="#i-ruler"/></svg><span class="rotulo">Escala</span><span class="mono" id="ctx-esc">100%</span></span>
  </div>

  <div class="faixa" id="faixa">
    <span class="faixa__t"><span class="rotulo">Lote</span><span class="mono">24</span></span>
    <div class="faixa__l" id="faixa-l"></div>
    
  </div>

  <div class="stage" id="stage">
    <div class="bf" id="bf" role="toolbar" aria-label="Ferramentas do elemento selecionado"></div>
    <figure class="pq" id="pq" data-sel="" style="--al:left">
      <div class="pq__sel pq__sel--moldura" aria-hidden="true"></div>
      <div class="pq__win" id="win" tabindex="0" role="group" aria-label="Foto. Arraste para posicionar."></div>
      <div class="pq__sel pq__sel--foto" aria-hidden="true"></div>
      <figcaption class="pq__band" id="band" tabindex="0" role="group" aria-label="Legenda. Toque para editar."><span class="lg-txt" id="lg-txt">Dia de rolê</span><span class="lg-meta" id="lg-meta">14.07.26 • Campos do Jordão, SP</span></figcaption>
      <div class="pq__sel pq__sel--texto" aria-hidden="true"></div>
      <img class="pq__sig pq__sig--dir" id="sig" src="../../assets/img/logos/Logo_tipografia_lateral.png" alt="">
      <span class="qdot" aria-hidden="true"></span>
      <div class="guia" id="guia" aria-hidden="true"></div>
    </figure>
  </div>
  <div class="under">
    <button type="button" class="ib" id="fprev" aria-label="Foto anterior"><svg class="ico"><use href="#i-prev"/></svg></button>
        <span class="cota"><svg class="ico sm"><use href="#i-ruler"/></svg><span class="rotulo">Passe-partout inferior</span><span class="mono">25 mm</span></span>
    <span class="chip">Ajustada</span>
    <button type="button" class="ib" id="fnext" aria-label="Foto seguinte"><svg class="ico"><use href="#i-next"/></svg></button>
  </div>

</section>

<aside class="panel" id="panel" aria-label="Painel">
  <button type="button" class="sheet__grab" id="grab" aria-label="Tamanho do painel"><span></span></button>
  <div class="tabs" role="tablist" aria-label="Painéis">
    <button type="button" role="tab" class="tab" data-p="fotos"><svg class="ico"><use href="#i-photos"/></svg>Fotos</button>
    <button type="button" role="tab" class="tab" data-p="recorte"><svg class="ico"><use href="#i-crop"/></svg>Recorte</button>
    <button type="button" role="tab" class="tab" data-p="ajustes"><svg class="ico"><use href="#i-adjust"/></svg>Ajustes</button>
    <button type="button" role="tab" class="tab" data-p="texto" aria-selected="true"><svg class="ico"><use href="#i-text"/></svg>Texto</button>
    <button type="button" role="tab" class="tab" data-p="stickers"><svg class="ico"><use href="#i-sticker"/></svg>Stickers</button>
    <button type="button" role="tab" class="tab" data-p="moldura"><svg class="ico"><use href="#i-frame"/></svg>Moldura</button>
    <button type="button" role="tab" class="tab" data-p="dados"><svg class="ico"><use href="#i-data"/></svg>Dados</button>
  </div>

  <div class="panel__in" id="panel-in"></div>
  <div class="panel__ft" id="panel-ft"></div>
</aside>

<div class="bar">
  <span class="bar__t"><strong>24 fotos</strong> · A4 retrato · 6 folhas</span>

</div>
</div>
