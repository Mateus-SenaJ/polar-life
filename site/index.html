<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/img/logos/Logo_favicon_PolarLife.png">
<title>Polar Life · Algumas memórias merecem sair da tela</title>
<meta name="description" content="Transforme os momentos que vivem no seu celular em polaroids feitas para tocar, presentear e guardar por muitos anos.">
<meta name="color-scheme" content="light">
<!-- PENDENTE (T6, TP-06): Caveat ainda vem do Google Fonts neste protótipo. Hospedar antes de produção. Inter já está embutida. -->
<link rel="stylesheet" href="assets/css/base/fonts.css">
<link rel="stylesheet" href="assets/css/base/tokens.css">
<link rel="stylesheet" href="assets/css/base/led.css">
<link rel="stylesheet" href="assets/css/pages/apresentacao.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="#inicio" aria-label="Polar Life, ir para o início"><img class="logo-h" src="assets/img/logos/Logo_tipografia_lateral.png" width="116" height="40" alt="Polar Life"></a>
  </div>
</header>

<main id="inicio">
  <section class="wrap hero" aria-labelledby="titulo">
    <div class="hero__copy">
      <p class="eyebrow">Suas fotos merecem o mundo real</p>
      <h1 id="titulo" class="hero__title">Algumas memórias merecem sair <span class="hl">da tela.</span></h1>
      <p class="hero__lead">Transforme os momentos que vivem no seu celular em polaroids feitas para tocar, presentear e guardar por muitos anos.</p>

      <div class="hero__cta">
        <a class="led-btn led-btn--light" href="app/#vazia">
          <span class="smoke-layer" aria-hidden="true"></span>
          <span class="btn-content">Criar minhas polaroids
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </a>
      </div>

      <p class="hero__more">
        <a class="link-more" href="como-funciona/">Ver como funciona
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </a>
      </p>
    </div>

    <div class="stack" role="img" aria-label="Exemplo de três polaroids com legendas">
      <figure class="polaroid p1"><div class="polaroid__photo"></div><figcaption>Dias de sol<img class="sign" src="assets/img/logos/Logo_tipografia_lateral.png" alt=""></figcaption></figure>
      <figure class="polaroid p2"><div class="polaroid__photo"></div><figcaption>Nós dois<img class="sign" src="assets/img/logos/Logo_tipografia_lateral.png" alt=""></figcaption></figure>
      <figure class="polaroid p3"><div class="polaroid__photo"></div><figcaption>Dia de rolê<img class="sign" src="assets/img/logos/Logo_tipografia_lateral.png" alt=""></figcaption></figure>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <img class="logo-v" src="assets/img/logos/logo_oficial_PolarLife.png" width="111" height="96" alt="Polar Life">
    <ul class="legal">
      <li><a href="legal/#privacidade">Privacidade</a></li>
      <li><a href="legal/#termos">Termos</a></li>
      <li><a href="legal/#cookies">Cookies</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
